<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏦 Cuentas — Finanzas Personales</title>
<link rel="stylesheet" href="assets/shared.css">
</head>
<body>

<div class="topbar">
  <div class="brand"><a href="index.html" class="back">← Menú</a></div>
  <div id="userBadgeContainer"></div>
</div>

<div class="main">
  <div class="page-header">
    <div>
      <h1>🏦 Cuentas</h1>
      <p>Bancos, tarjetas y efectivo</p>
    </div>
    <button class="btn btn-primary admin-only" id="btnNueva">+ Nueva cuenta</button>
  </div>

  <div id="notice"></div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th></th><th>Nombre</th><th>Tipo</th><th>Moneda</th><th>Saldo inicial</th><th class="admin-only"></th>
        </tr>
      </thead>
      <tbody id="tbodyCuentas"></tbody>
    </table>
    <div id="emptyState" class="empty hidden">
      <div class="empty-icon">🏦</div>
      <p>Todavía no hay cuentas cargadas.</p>
    </div>
  </div>
</div>

<!-- Modal simple -->
<div id="modalCuenta" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:200;">
  <div class="card" style="width:100%;max-width:420px;">
    <h3 id="modalTitle" style="margin-top:0;">Nueva cuenta</h3>
    <form id="formCuenta">
      <input type="hidden" id="cId">
      <div class="field">
        <label>Nombre</label>
        <input type="text" id="cNombre" required>
      </div>
      <div class="form-row">
        <div class="field">
          <label>Tipo</label>
          <select id="cTipo">
            <option value="banco">Banco</option>
            <option value="efectivo">Efectivo</option>
            <option value="tarjeta_credito">Tarjeta de crédito</option>
            <option value="inversion">Inversión</option>
            <option value="crypto">Crypto</option>
          </select>
        </div>
        <div class="field">
          <label>Moneda</label>
          <select id="cMoneda">
            <option value="ARS">ARS</option>
            <option value="USD">USD</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Saldo inicial</label>
        <input type="number" id="cSaldoInicial" step="0.01" value="0">
      </div>
      <div class="field">
        <label>Emoji (opcional)</label>
        <input type="text" id="cEmoji" maxlength="2" placeholder="🏦">
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;">
        <button type="button" class="btn" id="btnCancelar">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { supabase, requireAuth, renderUserBadge, applyReadOnlyMode } from './assets/supabase-client.js';

let profile = null;

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  setTimeout(() => t.className = '', 2600);
}

function uid() {
  return 'c_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
}

async function cargarCuentas() {
  const { data, error } = await supabase
    .from('cuentas')
    .select('*')
    .order('nombre', { ascending: true });

  if (error) {
    document.getElementById('notice').innerHTML =
      `<div class="alert alert-danger">Error cargando cuentas: ${error.message}</div>`;
    return;
  }

  const tbody = document.getElementById('tbodyCuentas');
  const empty = document.getElementById('emptyState');
  tbody.innerHTML = '';

  if (!data.length) {
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  for (const c of data) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${c.emoji || '🏦'}</td>
      <td>${c.nombre}</td>
      <td>${c.tipo}</td>
      <td>${c.moneda}</td>
      <td>${Number(c.saldo_inicial).toLocaleString('es-AR', { minimumFractionDigits: 2 })}</td>
      <td class="admin-only" style="text-align:right;">
        <button class="btn btn-sm" data-edit="${c.id}">Editar</button>
        <button class="btn btn-sm btn-danger" data-del="${c.id}">Borrar</button>
      </td>
    `;
    tbody.appendChild(tr);
  }

  tbody.querySelectorAll('[data-edit]').forEach(b =>
    b.addEventListener('click', () => abrirModal(data.find(c => c.id === b.dataset.edit)))
  );
  tbody.querySelectorAll('[data-del]').forEach(b =>
    b.addEventListener('click', () => borrarCuenta(b.dataset.del))
  );

  applyReadOnlyMode(profile?.is_admin);
}

function abrirModal(cuenta) {
  document.getElementById('modalTitle').textContent = cuenta ? 'Editar cuenta' : 'Nueva cuenta';
  document.getElementById('cId').value = cuenta?.id || '';
  document.getElementById('cNombre').value = cuenta?.nombre || '';
  document.getElementById('cTipo').value = cuenta?.tipo || 'banco';
  document.getElementById('cMoneda').value = cuenta?.moneda || 'ARS';
  document.getElementById('cSaldoInicial').value = cuenta?.saldo_inicial ?? 0;
  document.getElementById('cEmoji').value = cuenta?.emoji || '';
  document.getElementById('modalCuenta').classList.remove('hidden');
}

function cerrarModal() {
  document.getElementById('modalCuenta').classList.add('hidden');
}

async function guardarCuenta(e) {
  e.preventDefault();
  const id = document.getElementById('cId').value || uid();
  const payload = {
    id,
    nombre: document.getElementById('cNombre').value.trim(),
    tipo: document.getElementById('cTipo').value,
    moneda: document.getElementById('cMoneda').value,
    saldo_inicial: parseFloat(document.getElementById('cSaldoInicial').value) || 0,
    emoji: document.getElementById('cEmoji').value.trim() || null
  };
  const { error } = await supabase.from('cuentas').upsert(payload);
  if (error) {
    showToast('Error: ' + error.message, 'error');
    return;
  }
  showToast('Cuenta guardada');
  cerrarModal();
  cargarCuentas();
}

async function borrarCuenta(id) {
  if (!confirm('¿Eliminar esta cuenta?')) return;
  const { error } = await supabase.from('cuentas').delete().eq('id', id);
  if (error) { showToast('Error: ' + error.message, 'error'); return; }
  showToast('Cuenta eliminada');
  cargarCuentas();
}

document.getElementById('btnNueva').addEventListener('click', () => abrirModal(null));
document.getElementById('btnCancelar').addEventListener('click', cerrarModal);
document.getElementById('formCuenta').addEventListener('submit', guardarCuenta);

(async () => {
  const auth = await requireAuth();
  if (!auth) return;
  profile = auth.profile;
  renderUserBadge(document.getElementById('userBadgeContainer'), profile);
  applyReadOnlyMode(profile?.is_admin);
  if (!profile?.is_admin) {
    document.getElementById('notice').innerHTML =
      `<div class="alert alert-info">👁️ Modo solo lectura: no podés crear, editar ni borrar cuentas.</div>`;
  }
  cargarCuentas();
})();
</script>

</body>
</html>
